    <script>
      (function () {
        var SCENE = 4;

        /* ---- kinetic-beat-slam: ONE tempo grid drives every entrance ---- */
        var PULSE = 0.15; // seconds per sub-beat
        var BEATS = [
          PULSE * 8, // 1.20  Scene 2 — 「福山グランプリ」が叩きつけられる
          PULSE * 15, // 2.25  Scene 3 — 「20.7km」着地 ＋ 背景 cut
          PULSE * 17, // 2.55  Scene 3 — 「ワンウェイ」だけ一拍遅れて強く
          PULSE * 21, // 3.15  Scene 4 — 行き先
          PULSE * 23, // 3.45  Scene 4 — 英字ラベル
        ];
        var RULE_BEAT = PULSE * 18; // 2.70 — アクセントの棒が引かれる

        /* ---- cut-the-curve (cut-catalog.md) ----
           The two background clips butt at CUT. The copy block carries the seam:
           it accelerates LEFT into the cut (power4.in) and the same distance /
           duration decelerates LEFT out of it (power4.out) — mirrored halves of one
           power4.inOut, so velocity matches exactly at the swap frame. Same peak blur
           (10px, the text-scale value) on both sides; the exit's opacity dies right
           on the cut, the entry fades in fast from 0.35 under its deceleration. */
        var CUT = BEATS[1]; // 2.25
        var CUT_HALF = 0.3;
        var CUT_X = 230;
        var CUT_BLUR = 10;

        var tl = gsap.timeline({ paused: true });

        // Scene 2 (1.2-2.2s) — beat 1: scale + blur slam down into the lower-left.
        tl.fromTo(
          ".f03-fukuyama-city",
          { y: -46, scale: 1.18, opacity: 0, filter: "blur(12px)" },
          {
            y: 0,
            scale: 1,
            opacity: 1,
            filter: "blur(0px)",
            duration: 0.42,
            ease: "power4.out",
          },
          BEATS[0],
        );

        // Scene 2 -> 3 seam, exit half: leftward, accelerating.
        tl.fromTo(
          ".f03-fukuyama-copy",
          { x: 0, filter: "blur(0px)" },
          {
            x: -CUT_X,
            filter: "blur(" + CUT_BLUR + "px)",
            duration: CUT_HALF,
            ease: "power4.in",
            immediateRender: false,
          },
          CUT - CUT_HALF,
        );
        tl.fromTo(
          ".f03-fukuyama-copy",
          { opacity: 1 },
          {
            opacity: 0,
            duration: 0.18,
            ease: "power2.in",
            immediateRender: false,
          },
          CUT - 0.18,
        );

        // Seam, entry half: same direction, same distance, decelerating.
        tl.fromTo(
          ".f03-fukuyama-copy",
          { x: CUT_X, opacity: 0.35, filter: "blur(" + CUT_BLUR + "px)" },
          {
            x: 0,
            opacity: 1,
            filter: "blur(0px)",
            duration: CUT_HALF,
            ease: "power4.out",
            immediateRender: false,
          },
          CUT,
        );

        // Scene 3 (2.2-3.1s) — beat 2: the distance snaps in from the side.
        tl.fromTo(
          ".f03-fukuyama-num",
          { x: -180, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.38, ease: "expo.out" },
          BEATS[1],
        );

        // beat 3: 「ワンウェイ」— later, and harder. Overshoot pop, the one emphasis of the frame.
        tl.fromTo(
          ".f03-fukuyama-emph",
          { scale: 1.55, opacity: 0, filter: "blur(9px)" },
          {
            scale: 1,
            opacity: 1,
            filter: "blur(0px)",
            duration: 0.4,
            ease: "back.out(2)",
          },
          BEATS[2],
        );
        tl.fromTo(
          ".f03-fukuyama-rule",
          { scaleX: 0, opacity: 1 },
          { scaleX: 1, duration: 0.28, ease: "power3.out" },
          RULE_BEAT,
        );

        // Scene 4 (3.1-4.0s) — beat 4: 行き先が下から起き上がる。
        tl.fromTo(
          ".f03-fukuyama-dest",
          { y: 24, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.4, ease: "circ.out" },
          BEATS[3],
        );

        // beat 5: 英字ラベルが出る。以後 4.0s まで静止して読ませる。
        // 字間 (letterSpacing) は動かさない。文字の再配置が整数ピクセルに丸められ、

        // CSS 側で 0.14em に固定し、動きは y と opacity だけで作る。
        tl.fromTo(
          ".f03-fukuyama-mono",
          { opacity: 0, y: 18 },
          {
            opacity: 1,
            y: 0,
            duration: 0.4,
            ease: "power2.out",
          },
          BEATS[4],
        );

        // hold the full scene length so the sub-composition never ends short.
        tl.to({}, { duration: SCENE }, 0);

        window.__timelines = window.__timelines || {};
        window.__timelines["03-fukuyama"] = tl;
        tl.seek(0);
      })();
