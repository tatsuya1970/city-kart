      var tl = gsap.timeline({ paused: true });

      /* kinetic-beat-slam: ONE tempo grid drives every onset. The pulse is carried by

        "#f02-hiroshima-curtain",
        { opacity: 0 },
        { opacity: 0.38, duration: 0.16, ease: "power4.in" },
        SEAM - 0.16,

      tl.to("#f02-hiroshima-curtain", { opacity: 0, duration: 0.2, ease: "power4.out" }, SEAM);

      /* Scene 2 (beat 1) — 広島グランプリ is slammed into the lower left the moment the

          y: 34,
          opacity: 0,
          filter: "blur(16px)",

          y: 0,

          duration: 0.44,

        "#f02-hiroshima-stat",
        { x: 150, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.34, ease: "expo.out" },
        BEATS[1],
