<template>
  <div id="root" data-composition-id="02-finish" data-width="1080" data-height="1920" data-start="0" data-duration="1.9">
    <style>
    @font-face {
      font-family: "Noto Sans JP";
      src: url("assets/fonts/NotoSansJP-400.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;

    }
    @font-face {
      font-family: "Noto Sans JP";
      src: url("assets/fonts/NotoSansJP-700.woff2") format("woff2");
      font-weight: 700;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: "Noto Sans JP";
      src: url("assets/fonts/NotoSansJP-900.woff2") format("woff2");
      font-weight: 900;
      font-style: normal;
      font-display: block;
    }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        container-type: size;
        font-family: "Noto Sans JP", sans-serif;
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      .f02-veil {
        background: #0B1A2A;
        opacity: 0;
      }
      .f02-stage {
        position: absolute;
        top: 0;
        left: 60px;
        right: auto;
        bottom: auto;
        width: 840px;
        height: 1920px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding-top: 720px;

      }
      .f02-rule {
        width: 36px;

      .f02-word {
        font-family: "Noto Sans JP", sans-serif;

        transform-origin: center center;
        white-space: nowrap;
      }
    </style>

    <!-- approved frame video hoisted by assemble-index -->

    <div id="f02-veil" class="clip f02-veil" data-start="0" data-duration="1.9" data-track-index="1"></div>

    <div id="f02-stage" class="clip f02-stage" data-start="0" data-duration="1.9" data-track-index="2">
      <div class="f02-rule" id="f02-rule"></div>
      <div class="f02-word" id="f02-word" data-layout-allow-overlap="">FINISH</div>
      <div class="f02-time-wrap">
        <span class="f02-time" id="f02-time" data-layout-allow-overlap="">0:00.00</span>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });

        var veil = document.getElementById("f02-veil");
        var word = document.getElementById("f02-word");
        var rule = document.getElementById("f02-rule");
        var timeEl = document.getElementById("f02-time");

        // Scene 1 (0.0-0.4s): footage sinks into navy, FINISH slams in.
        tl.fromTo(veil, { opacity: 0.15 }, { opacity: 0.9, duration: 0.4, ease: "power2.out" }, 0);
        tl.fromTo(
          word,
          { scale: 1.9, opacity: 0, filter: "blur(18px)" },
          { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.28, ease: "expo.out" },
          0.04
        );
        tl.to(word, { y: 10, duration: 0.06, ease: "power1.out" }, 0.32);
        tl.to(word, { y: 0, duration: 0.14, ease: "power2.out" }, 0.38);
        tl.fromTo(rule, { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: "power3.out" }, 0.2);

        // Scene 2 (0.4-1.5s): time counts up fast from 0:00.00 and lands on 2:59.53.
        var TARGET_CS = 17953; // 2:59.53 in centiseconds
        var COUNT_AT = 0.4;
        var COUNT_DUR = 0.85;
        var state = { cs: 0 };
        function fmt(cs) {
          cs = Math.round(cs);
          if (cs > TARGET_CS) cs = TARGET_CS;
          var m = Math.floor(cs / 6000);
          var s = Math.floor((cs % 6000) / 100);
          var c = cs % 100;
          return m + ":" + (s < 10 ? "0" : "") + s + "." + (c < 10 ? "0" : "") + c;
        }
        timeEl.textContent = fmt(0);
        tl.set(timeEl, { opacity: 0, scale: 0.55 }, 0);
        tl.to(timeEl, { opacity: 1, duration: 0.12, ease: "power1.out" }, COUNT_AT);
        tl.fromTo(
          state,
          { cs: 0 },
          {
            cs: TARGET_CS,
            duration: COUNT_DUR,
            ease: "power3.out",
            onUpdate: function () {
              timeEl.textContent = fmt(state.cs);
            }
          },
          COUNT_AT
        );
        tl.to(timeEl, { scale: 1, duration: COUNT_DUR, ease: "power3.out" }, COUNT_AT);
        // Landing punch once the time locks.
        tl.to(timeEl, { scale: 1.06, duration: 0.08, ease: "power2.out" }, COUNT_AT + COUNT_DUR);
        tl.to(timeEl, { scale: 1, duration: 0.17, ease: "power2.out" }, COUNT_AT + COUNT_DUR + 0.08);
        // Veil keeps settling a touch darker under the landed time.
        tl.to(veil, { opacity: 0.94, duration: 1.1, ease: "none" }, 0.4);

        window.__timelines["02-finish"] = tl;
      })();
    </script>
