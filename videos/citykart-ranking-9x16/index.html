<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #EEF1F4;
      }
      /* 重なり順 (scripts/fix-layering.mjs) */
      /* 映像はフレームの下。文字・暗幕はフレーム側 (.scene) に乗っている */
      .scene { z-index: 1; }
      video.clip { z-index: 0; }

      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="3.5"
        data-track-index="0"
      ></div>

      <div
        id="el-02-finish"
        class="scene"
        data-composition-id="02-finish"
        data-composition-src="compositions/frames/02-finish.html"
        data-start="3.5"
        data-duration="1.9"
        data-track-index="1"
      ></div>

      <div
        id="el-03-register"
        class="scene"
        data-composition-id="03-register"
        data-composition-src="compositions/frames/03-register.html"
        data-start="5"
        data-duration="5.5"
        data-track-index="0"
      ></div>

      <div
        id="el-04-top20"
        class="scene"
        data-composition-id="04-top20"
        data-composition-src="compositions/frames/04-top20.html"
        data-start="10"
        data-duration="2.4"
        data-track-index="1"
      ></div>

      <div
        id="el-05-cta"
        class="scene"
        data-composition-id="05-cta"
        data-composition-src="compositions/frames/05-cta.html"
        data-start="12"
        data-duration="3"
        data-track-index="0"
      ></div>

      <video id="f01-video-city" src="assets/hiro-city.mp4" muted playsinline
        class="clip"
        style="position:absolute;left:0px;top:0px;width:1080px;height:1920px;object-fit:cover"
        data-start="0"
        data-duration="1.8"
        data-track-index="1000"
      ></video>

      <video id="f01-video-gate" src="assets/hiro-dome-gate.mp4" data-media-start="0.3" muted playsinline
        class="clip"
        style="position:absolute;left:0px;top:0px;width:1080px;height:1920px;object-fit:cover"
        data-start="1.8"
        data-duration="1.7"
        data-track-index="1001"
      ></video>

      <video id="f02-footage" src="assets/hiro-dome-gate.mp4" data-media-start="2.0" muted playsinline
        class="clip"
        style="position:absolute;left:0px;top:0px;width:1080px;height:1920px;object-fit:cover"
        data-start="3.5"
        data-duration="1.5"
        data-track-index="2000"
      ></video>

      <video id="f05-cta-bg" src="assets/hiro-city.mp4" muted playsinline
        class="clip"
        style="position:absolute;left:0px;top:0px;width:1080px;height:1920px;object-fit:cover"
        data-start="12"
        data-duration="3"
        data-track-index="5000"
      ></video>
      <!-- BGM（ユーザー提供）。頭 0.3s で立ち上げ、終わり 1.2s で落とす。
           ナレーションが無いので carve は掛けていない。 -->
      <audio
        id="bgm"
        class="clip"
        src="assets/bgm.mp3"
        data-start="0"
        data-duration="15"
        data-track-index="9"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0},{"t":0.3,"v":1},{"t":13.8,"v":1},{"t":15,"v":0}]}]}'
      ></audio>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-02-finish", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 5);
        tl.fromTo("#el-03-register", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 5);
        tl.to("#el-03-register", { x: -1080, duration: 0.5, ease: "power3.inOut" }, 10);
        tl.fromTo("#el-04-top20", { x: 1080, opacity: 1 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 10);
        tl.to("#el-04-top20", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 12);
        tl.fromTo("#el-05-cta", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 12);
        tl.to({}, { duration: 15 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
