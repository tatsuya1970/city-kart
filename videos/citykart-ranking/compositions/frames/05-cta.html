  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // 右上を起点に大きく拡大し、LP 自身の見出し（左下）を画面の外へ出す。
      // 残るのは走行画と看板ゲートで、手前の文字とぶつからない。
      gsap.set("#f05-page", { transformOrigin: "100% 0%" });
      gsap.set("#f05-url", { transformOrigin: "0% 60%" });
      gsap.set("#f05-rule", { transformOrigin: "0% 50%" });

      /* ---------------- Scene 1 (0.0–1.0s) ----------------
         実画面が奥で立ち上がる（押し戻された位置へ沈みながら浮かぶ）。

        "#f05-page",
        { opacity: 0, scale: 1.72, y: 40 },
        { opacity: 0.85, scale: 1.64, y: 0, duration: 0.9, ease: "power3.out" },
        0,
      );

      var CITY = ["#f05-city-1", "#f05-city-2", "#f05-city-3"];

        tl.fromTo(
          sel,
          { opacity: 0, x: -36, y: 18 },
          { opacity: 1, x: 0, y: 0, duration: 0.34, ease: "power3.out" },
          0.1 + i * 0.16,
        );
      });
      ["#f05-dot-1", "#f05-dot-2"].forEach(function (sel, i) {
        tl.fromTo(
          sel,
          { opacity: 0 },
          { opacity: 1, duration: 0.2, ease: "power1.out" },
          0.2 + i * 0.16,

      tl.fromTo(
        "#f05-rank",

        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },

         背面の実画面は一段奥へ沈み、URL だけが前に残る。 */

        "#f05-rule",
        { opacity: 0, scaleX: 0 },
        { opacity: 1, scaleX: 1, duration: 0.3, ease: "power2.out" },
        0.95,
      );

      tl.fromTo(
