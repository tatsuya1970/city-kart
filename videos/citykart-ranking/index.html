<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #EEF1F4;
      }
      /* 重なり順 (scripts/fix-layering.mjs) */
      /* 映像はフレームの下。文字・暗幕はフレーム側 (.scene) に乗っている */
      .scene { z-index: 1; }
      video.clip { z-index: 0; }

      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-kbh8" id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1920" data-height="1080">
      <div data-hf-id="hf-izru" id="el-01-hook" class="scene" data-composition-id="01-hook" data-composition-src="compositions/frames/01-hook.html" data-start="0" data-duration="3.5" data-track-index="0"></div>

      <div data-hf-id="hf-fueq" id="el-02-finish" class="scene" data-composition-id="02-finish" data-composition-src="compositions/frames/02-finish.html" data-start="3.5" data-duration="1.9" data-track-index="1"></div>

      <div data-hf-id="hf-9663" id="el-03-register" class="scene" data-composition-id="03-register" data-composition-src="compositions/frames/03-register.html" data-start="5" data-duration="5.5" data-track-index="0"></div>

      <div data-hf-id="hf-6ju3" id="el-04-top20" class="scene" data-composition-id="04-top20" data-composition-src="compositions/frames/04-top20.html" data-start="10" data-duration="2.4" data-track-index="1"></div>

      <div data-hf-id="hf-37y9" id="el-05-cta" class="scene" data-composition-id="05-cta" data-composition-src="compositions/frames/05-cta.html" data-start="12" data-duration="3" data-track-index="0"></div>

      <video data-hf-id="hf-30kd" id="f01-video-city" src="assets/hiro-city.mp4" muted playsinline class="clip" style="position:absolute;left:0px;top:0px;width:1920px;height:1080px;object-fit:cover" data-start="0" data-duration="1.8" data-track-index="1000"></video>

      <video data-hf-id="hf-5xs6" id="f01-video-gate" src="assets/hiro-dome-gate.mp4" data-media-start="0.3" muted playsinline class="clip" style="position:absolute;left:0px;top:0px;width:1920px;height:1080px;object-fit:cover" data-start="1.8" data-duration="1.7" data-track-index="1001"></video>

      <video data-hf-id="hf-igf5" id="f02-footage" src="assets/hiro-dome-gate.mp4" data-media-start="2.0" muted playsinline class="clip" style="position:absolute;left:0px;top:0px;width:1920px;height:1080px;object-fit:cover" data-start="3.5" data-duration="1.5" data-track-index="2000"></video>
      <!-- BGM（ユーザー提供）。頭 0.3s で立ち上げ、終わり 1.2s で落とす。
           ナレーションが無いので carve は掛けていない。 -->
      <audio data-hf-id="hf-7yjj" id="bgm" class="clip" src="assets/bgm.mp3" data-start="0" data-duration="15" data-track-index="9" data-automation="{&quot;version&quot;:1,&quot;lanes&quot;:[{&quot;target&quot;:&quot;volume&quot;,&quot;points&quot;:[{&quot;t&quot;:0,&quot;v&quot;:0},{&quot;t&quot;:0.3,&quot;v&quot;:1},{&quot;t&quot;:13.8,&quot;v&quot;:1},{&quot;t&quot;:15,&quot;v&quot;:0}]}]}"></audio>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-02-finish", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 5);
        tl.fromTo("#el-03-register", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 5);
        tl.to("#el-03-register", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 10);
        tl.fromTo("#el-04-top20", { x: 1920, opacity: 1 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 10);
        tl.to("#el-04-top20", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 12);
        tl.fromTo("#el-05-cta", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 12);
        tl.to({}, { duration: 15 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
